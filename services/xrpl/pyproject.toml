# XRPL microservice — Devnet wallet/vault/loan submissions + explorer links.

[project]
name = "coinfish-xrpl"
version = "0.1.0"
description = "CoinFish XRPL chain microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "xrpl-py>=5.0.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false
