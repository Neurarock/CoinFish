# Production CI on `main` — lint → pytest → frontend build → deploy to Vercel.
name: CI (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync Python workspace
        run: uv sync --all-packages --frozen

      - name: Lint backend (ruff)
        run: uv run ruff check backend api db_service services

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: npm run lint

  test:
    name: Pytest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync Python workspace
        run: uv sync --all-packages --frozen

      - name: Run pytest
        run: uv run pytest backend/tests db_service/tests services/test_health.py -q

  build:
    name: Frontend build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # Vercel installs Python via uv from pyproject.toml / uv.lock / requirements.txt.
      # Refresh the API requirements export so the serverless function always gets
      # the locked coinfish-api runtime set (not empty workspace root deps / not
      # the full microservice workspace).
      - name: Export Vercel Python requirements
        run: |
          uv sync --all-packages --frozen
          uv export --package coinfish-api --no-dev --no-hashes --frozen \
            -o requirements.txt
          uv export --package coinfish-api --no-dev --no-hashes --frozen \
            -o backend/requirements.txt
          echo "Exported API requirements for Vercel:"
          head -n 20 requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@39

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
