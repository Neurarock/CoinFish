services:
  postgres:
    image: postgres:16-alpine
    container_name: coinfish-postgres
    environment:
      POSTGRES_USER: coinfish
      POSTGRES_PASSWORD: coinfish
      POSTGRES_DB: coinfish
    ports:
      - "5433:5432"
    volumes:
      - coinfish_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinfish -d coinfish"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coinfish_pgdata:
