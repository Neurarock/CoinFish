# CoinFish persistence microservice — FastAPI + SQLAlchemy + Alembic on port 8001.

[project]
name = "coinfish-db"
version = "0.1.0"
description = "CoinFish Postgres data service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "pydantic[email]>=2.0",
]

[tool.uv]
package = false
