# CoinFish — Python workspace (uv)

[project]
name = "coinfish"
version = "0.2.0"
description = "CoinFish FastAPI microservices workspace"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps for the Vercel serverless gateway (api/index.py → backend).
# Domain microservices keep their own deps in member pyproject.toml files.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "python-dotenv>=1.0",
  "xrpl-py>=5.0.0",
  "psycopg[binary]>=3.1",
  "PyJWT[crypto]>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "backend",
  "db_service",
  "services/auth",
  "services/pools",
  "services/lending",
  "services/borrowing",
  "services/xrpl",
  "services/admin",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "db_service/tests", "services"]
pythonpath = ["."]
